---
on:
  workflow_call:
    inputs:
      include_terraform:
        description: 'Whether to include terraform pre-commit checks'
        default: false
        required: false
        type: boolean
      uv_sync_groups:
        type: string
        default: --all-extras --all-groups --locked

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Terraform
        if: ${{ inputs.include_terraform }}
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1

      - name: Setup TFLint
        if: ${{ inputs.include_terraform }}
        uses: terraform-linters/setup-tflint@b480b8fcdaa6f2c577f8e4fa799e89e756bb7c93  # v6.2.2

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Install the project
        run: uv sync ${{ inputs.uv_sync_groups }}

      - name: Install Checkov
        if: ${{ inputs.include_terraform }}
        run: pipx install checkov

      - name: Run Prek
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d  # v3.1.0
