---
name: List Open PRs
on:
  workflow_call:
    inputs:
      tag:
        type: string
        description: Tag to filter PRs on, also known as a label.
      dry_run:
        type: boolean
        default: false
        description: If true, workflow prints PRs to logs instead of sending Slack
          alerts.
    secrets:
      slack_workflow_url:
        required: true
        description: Slack Incoming Webhook URL used to send alerts.
jobs:
  list-open-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construct Query
        id: construct-query
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "query=\"-is:draft label:${{ inputs.tag }}\"" >> $GITHUB_OUTPUT
          else
            echo "query=\"-is:draft\"" >> $GITHUB_OUTPUT
          fi
      - name: Checkout Scripts Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ministryofjustice/data-engineering-github-actions
          path: data-engineering-github-actions
          ref: main
          token: ${{ github.token }}
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: ./data-engineering-github-actions
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install the project
        working-directory: ./data-engineering-github-actions
        run: uv sync
      - name: Get Open PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list \
            --search ${{ steps.construct-query.outputs.query }} \
            --json number,title,url,author,createdAt,updatedAt,isDraft \
            > "./data-engineering-github-actions/prs.json"
      - name: Alert Slack
        if: ${{ inputs.dry_run == false }}
        working-directory: ./data-engineering-github-actions
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.slack_workflow_url }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          uv run scripts/list_open_prs.py
      - name: Dry Run - Show PRs in action logs only (no Slack alert)
        if: ${{ inputs.dry_run }}
        working-directory: ./data-engineering-github-actions
        run: |-
          echo "Dry run mode ON. Printing PRs instead of sending to Slack:"
          cat prs.json
