[project]
name = "data-engineering-github-actions"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "humanize>=4.13.0",
    "checkov>=3.3.1",
    "typer>=0.26.7",
    "slack-sdk>=3.42.0",
    "pytest-cov>=7.1.0",
    "bandit>=1.9.4",
    "detect-secrets>=1.5.0",
]
[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "prek>=0.5.10",
    "ruff>=0.16.0",
]
test = [
    "pytest>=9.1.0",
]

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D213", "COM812"]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = ["S101", "PLC0415"]
